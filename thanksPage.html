      * {

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;

      .thanks_page .div_btn {

  background: linear-gradient(#E12F2C, #DF2F2B);

    border-radius: 10px;
      }
      .thanks_page .text .img_check {

        text-align: center;
        margin: 0 auto 5px;

        body.thanks_page_page {
          background: #313131;

        .thanks_page p {
